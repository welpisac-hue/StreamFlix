# Base44 development environment for StreamFlix.
# Runs the Next.js dev server from the cloned source with live reload,
# plus a local PostgreSQL (with SSL, since the Prisma pg Pool hardcodes SSL).
#
# Bring up:  docker compose -f docker-compose.base44.yml up -d --build
services:
  db:
    build:
      context: ./docker
      dockerfile: Dockerfile.pg
    environment:
      POSTGRES_USER: streamflix
      POSTGRES_PASSWORD: streamflix
      POSTGRES_DB: streamflix
    command: >
      postgres -c ssl=on
               -c ssl_cert_file=/var/lib/postgresql/server.crt
               -c ssl_key_file=/var/lib/postgresql/server.key
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamflix -d streamflix"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  migrate:
    # One-shot: install deps + generate the Prisma client. Exits 0 on success.
    # NOTE: intentionally does NOT run `prisma db push` or seed — the preview may
    # point at a real (production) Supabase database, and those would alter/wipe it.
    # To initialize a LOCAL database instead, run manually:
    #   docker compose -f docker-compose.base44.yml run --rm migrate sh -c \
    #     "npx prisma db push --accept-data-loss && npx tsx prisma/seed.ts"
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command:
      - sh
      - -ec
      - |
        npm ci
        npx prisma generate

  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      # Passthrough so next.config allowedDevOrigins can see the preview origin.
      - BASE44_PUBLIC_HOST_SUFFIX
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - |
        exec ./node_modules/.bin/next dev -H 0.0.0.0 -p 3000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: on-failure

volumes:
  pgdata:
  node_modules:
